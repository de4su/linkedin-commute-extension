<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Commute Time Settings</title>
<style>
  :root {
    --li-blue: #0a66c2;
    --ink: #1a1a1a;
    --muted: #5e5e5e;
    --border: #d9d9d9;
  }
  * { box-sizing: border-box; }
  body {
    width: 300px;
    margin: 0;
    padding: 16px;
    background: #fff;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  h1 {
    font-size: 14px;
    font-weight: 700;
    margin: 0 0 14px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  h1::before { content: "🧭"; font-size: 16px; }
  label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 14px 0 4px;
  }
  label:first-of-type { margin-top: 0; }
  input[type="text"],
  input[type="password"] {
    width: 100%;
    padding: 7px 9px;
    font-size: 13px;
    border: 1px solid var(--border);
    border-radius: 6px;
    outline: none;
  }
  input[type="text"]:focus,
  input[type="password"]:focus {
    border-color: var(--li-blue);
    box-shadow: 0 0 0 3px rgba(10, 102, 194, 0.15);
  }
  .modes { display: flex; gap: 8px; }
  .mode-option {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 0;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    user-select: none;
  }
  .mode-option input { accent-color: var(--li-blue); margin: 0; }
  .mode-option:has(input:checked) {
    border-color: var(--li-blue);
    background: rgba(10, 102, 194, 0.06);
    font-weight: 600;
  }
  button {
    width: 100%;
    margin-top: 16px;
    padding: 8px 0;
    background: var(--li-blue);
    color: white;
    font-size: 13px;
    font-weight: 600;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover { background: #094c92; }
  button:focus-visible { outline: 2px solid #094c92; outline-offset: 2px; }
  #status {
    min-height: 14px;
    margin: 8px 0 0;
    font-size: 11px;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>
<body>
  <h1>Commute Time</h1>

  <label for="homeCity" style="font-size: 12px; margin-top: 8px; display: block;">Home City (will show as 0m):</label>
  <div style="display: flex; gap: 8px; margin-bottom: 12px;">
    <input type="text" id="homeCity" placeholder="e.g. Rotterdam" style="flex: 2; font-size: 11px; padding: 4px;" />
    <button id="saveHomeCity" style="flex: 1; font-size: 11px;">Save</button>
  </div>

  <p style="font-size: 12px;">Upload a custom <code>9292_travel_times.csv</code> to use your own travel times database.</p>
  
  <input type="file" id="csvFile" accept=".csv" style="width: 100%; margin-bottom: 8px; font-size: 11px;" />
  
  <div style="display: flex; gap: 8px; margin-bottom: 12px;">
    <button id="clearData" style="flex: 1; background: #d93025; font-size: 11px; padding: 6px;">Clear Custom Data</button>
  </div>
  <p id="status" style="font-size: 11px; font-weight: bold; margin-bottom: 8px;"></p>

  <hr style="border: none; border-top: 1px solid var(--border); margin: 14px 0;">
  <label>Application Tracker</label>
  <p id="trackerStatus" style="font-size: 11px; color: var(--muted); margin: 4px 0 8px;">Loading...</p>
  <div style="display: flex; gap: 8px; margin-bottom: 8px;">
    <button id="exportTracker" style="flex: 1; background: #057642; font-size: 11px; padding: 6px;">Export CSV</button>
    <button id="clearTracker" style="flex: 1; background: #d93025; font-size: 11px; padding: 6px;">Clear History</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
